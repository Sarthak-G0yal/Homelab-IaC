---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/info-widgets/

- datetime:
        text_size: xl
        locale: en-IN
        format:
            dateStyle: full
            timeStyle: short
            hourCycle: h23

- openmeteo:
        label: Dharwad
        latitude: 15.4601
        longitude: 75.0078
        timezone: Asia/Kolkata
        units: metric
        cache: 5
        format:
            maximumFractionDigits: 0

- resources:
    cpu: true
    memory: true
    disk: /

- search:
    provider: duckduckgo
    target: _blank
