services:
  memos:
    image: neosmemo/memos:0.21.0
    restart: unless-stopped
    ports:
      - "5230:5230"
    volumes:
      - ./data:/var/opt/memos
    env_file:
      - .env
    labels:
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$$
      - wud.trigger.include=dockercompose.auto
    networks:
      - proxy

networks:
  proxy:
    external: true
