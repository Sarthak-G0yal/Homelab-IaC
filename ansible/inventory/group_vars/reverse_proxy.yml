traefik_domain: "homelab118.home"
traefik_version: "2.11.12"
traefik_log_level: "INFO"
traefik_enable_dashboard: true
traefik_dashboard_host: "traefik.{{ traefik_domain }}"

traefik_http_services:
  - name: proxmox-main
    host: "pve-main.{{ traefik_domain }}"
    url: "https://192.168.1.110:8006"
    servers_transport: proxmox-insecure
    flush_interval: "-1"
  
  - name: proxmox-sony
    host: "pve-1.{{ traefik_domain }}"
    url: "https://192.168.1.111:8006"
    servers_transport: proxmox-insecure
    flush_interval: "-1"

  - name: plex
    host: "plex.{{ traefik_domain }}"
    url: "http://192.168.1.130:32400"

  - name: jellyfin
    host: "jellyfin.{{ traefik_domain }}"
    url: "http://192.168.1.130:8096"

  - name: vault
    host: "vault.{{ traefik_domain }}"
    url: "http://192.168.1.131:8000"

  - name: dns
    host: "dns.{{ traefik_domain }}"
    url: "http://192.168.1.120"

  - name: dashboard
    host: "dashboard.{{ traefik_domain }}"
    url: "http://192.168.1.131:3000"

  - name: portainer
    host: "portainer.{{ traefik_domain }}"
    url: "http://192.168.1.131:9000"

  - name: n8n
    host: "n8n.{{ traefik_domain }}"
    url: "http://192.168.1.131:5678"
    middlewares:
      - n8n-headers

  - name: git
    host: "git.{{ traefik_domain }}"
    url: "http://192.168.1.131:4000"

  - name: asap
    host: "asap.{{ traefik_domain }}"
    url: "http://192.168.1.131:3005"

  - name: vert
    host: "vert.{{ traefik_domain }}"
    url: "http://192.168.1.131:3080"
  
  - name: wud
    host: "wud.{{ traefik_domain }}"
    url: "http://192.168.1.131:3002"

  - name: firefly
    host: "money.{{ traefik_domain }}"
    url: "http://192.168.1.131:8080"

  - name: memos
    host: "memos.{{ traefik_domain }}"
    url: "http://192.168.1.131:5230"

  - name: uptime
    host: "uptime.{{ traefik_domain }}"
    url: "http://192.168.1.131:3001"
    enabled: false

  - name: bastionvault
    host: "bastionvault.{{ traefik_domain }}"
    url: "http://192.168.1.153:8080"
    enabled: true