---
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - git
      - jq
    state: present
    update_cache: true

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://docker.com
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Find old Docker repository files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d/
    contains: 'download\.docker\.com'
  register: old_docker_repos

- name: Clean up old Docker repository files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ old_docker_repos.files }}"

- name: Add Docker Repository (DEB822 format)
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/ubuntu"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [stable]
    architectures: [amd64]
    signed_by: "https://download.docker.com/linux/ubuntu/gpg"
    state: present
    enabled: true
    install_python_debian: true

- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Start and enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
