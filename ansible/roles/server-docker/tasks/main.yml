---
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - git
      - jq
    state: present
    update_cache: yes

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Find old Docker repository files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d/
    contains: 'download\.docker\.com'
  register: old_docker_repos

- name: Clean up old Docker repository files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ old_docker_repos.files }}"

- name: Add Docker Repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    state: present
    filename: docker

- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Start and enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes

- name: Ensure /etc/bastionvault directory exists
  ansible.builtin.file:
    path: /etc/bastionvault
    state: directory
    mode: '0700'
    owner: root
    group: root

- name: Configure BastionVault Client ID
  ansible.builtin.copy:
    content: "{{ bastionvault_client_id }}"
    dest: /etc/bastionvault/client-id
    mode: '0600'
    owner: root
    group: root
  when: bastionvault_client_id is defined

- name: Configure BastionVault Client Secret
  ansible.builtin.copy:
    content: "{{ bastionvault_client_secret }}"
    dest: /etc/bastionvault/client-secret
    mode: '0600'
    owner: root
    group: root
  when: bastionvault_client_secret is defined

- name: Ensure /root/.ssh directory exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    mode: '0700'
    owner: root
    group: root

- name: Deploy GitHub SSH key
  ansible.builtin.copy:
    src: ~/.ssh/id_ed25519_homelab
    dest: /root/.ssh/id_ed25519_github
    mode: '0600'
    owner: root
    group: root

- name: Configure SSH for GitHub
  ansible.builtin.blockinfile:
    path: /root/.ssh/config
    create: yes
    mode: '0600'
    owner: root
    group: root
    block: |
      Host github.com
        HostName github.com
        User git
        IdentityFile /root/.ssh/id_ed25519_github
        IdentitiesOnly yes

- name: Clone docker-files repository
  ansible.builtin.git:
    repo: git@github.com:homelab118/docker-files.git
    dest: /home/server/docker/
    accept_hostkey: yes
    key_file: /root/.ssh/id_ed25519_github
    update: yes
  when: sync_docker_files | default(true)
