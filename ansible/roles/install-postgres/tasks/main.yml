---
#############################################################
# DEDICATED DATA DISK SETUP (OPTIONAL / AUTO-DETECTED)
#############################################################

- name: Check if dedicated data disk device exists
  ansible.builtin.stat:
    path: "{{ postgres_data_disk_device }}"
  register: postgres_disk_device_stat
  when: postgres_configure_disk | bool

- name: Format dedicated data disk filesystem
  community.general.filesystem:
    dev: "{{ postgres_data_disk_device }}"
    fstype: "{{ postgres_data_disk_fstype }}"
  when:
    - postgres_configure_disk | bool
    - postgres_disk_device_stat.stat.exists | default(false)

- name: Ensure data disk mount directory exists
  ansible.builtin.file:
    path: "{{ postgres_data_disk_mount_path }}"
    state: directory
    mode: "0755"
  when:
    - postgres_configure_disk | bool
    - postgres_disk_device_stat.stat.exists | default(false)

- name: Mount dedicated data disk in /etc/fstab
  ansible.posix.mount:
    path: "{{ postgres_data_disk_mount_path }}"
    src: "{{ postgres_data_disk_device }}"
    fstype: "{{ postgres_data_disk_fstype }}"
    opts: "{{ postgres_data_disk_mount_opts }}"
    state: mounted
  when:
    - postgres_configure_disk | bool
    - postgres_disk_device_stat.stat.exists | default(false)

#############################################################
# POSTGRESQL INSTALLATION
#############################################################

- name: Install Postgres packages
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgres_version }}"
      - "postgresql-contrib"
      - "python3-psycopg2"
      - "acl"
    state: present
    update_cache: yes

- name: Check if default Postgres cluster data directory exists
  ansible.builtin.stat:
    path: "{{ postgres_data_disk_mount_path }}/{{ postgres_version }}/main/PG_VERSION"
  register: postgres_cluster_stat

- name: Initialize PostgreSQL cluster if not present
  ansible.builtin.command:
    cmd: "pg_createcluster {{ postgres_version }} main --start"
  when: not postgres_cluster_stat.stat.exists

- name: Ensure correct ownership and permissions on Postgres data directory
  ansible.builtin.file:
    path: "{{ postgres_data_disk_mount_path }}"
    owner: postgres
    group: postgres
    mode: "0750"
    state: directory

- name: Ensure correct ownership on cluster main directory
  ansible.builtin.file:
    path: "{{ postgres_data_disk_mount_path }}/{{ postgres_version }}/main"
    owner: postgres
    group: postgres
    mode: "0700"
    state: directory
  when: postgres_cluster_stat.stat.exists or not postgres_cluster_stat.stat.exists

#############################################################
# CONFIGURATION
#############################################################

- name: Configure listen_addresses
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
    regexp: "^#?listen_addresses = .*"
    line: "listen_addresses = '{{ postgres_listen_addresses }}'"
  notify: Restart postgres

- name: Configure port
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
    regexp: "^#?port = .*"
    line: "port = {{ postgres_port }}"
  notify: Restart postgres

- name: Configure max_connections
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
    regexp: "^#?max_connections = .*"
    line: "max_connections = {{ postgres_max_connections }}"
  notify: Restart postgres

- name: Configure shared_buffers
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
    regexp: "^#?shared_buffers = .*"
    line: "shared_buffers = {{ postgres_shared_buffers }}"
  notify: Restart postgres

- name: Allow homelab subnet access in pg_hba.conf
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
    line: "host    all             all             {{ item }}            scram-sha-256"
    insertafter: "^# IPv4 local connections:"
  loop: "{{ postgres_allowed_subnets }}"
  notify: Reload postgres

- name: Ensure Postgres service is started and enabled
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: yes

# Flush handlers so service is restarted/reloaded before creating the user
- name: Flush handlers
  ansible.builtin.meta: flush_handlers

#############################################################
# USER & SECURITY SETUP
#############################################################

- name: Create or update default admin user
  become: yes
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ postgres_admin_user }}"
    password: "{{ postgres_admin_password }}"
    role_attr_flags: SUPERUSER
    state: present
  when:
    - postgres_admin_password is defined
    - postgres_admin_password | string | length > 0
