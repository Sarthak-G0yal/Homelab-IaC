---
- name: Ensure backup directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  with_items:
    - /opt/backups/postgres
    - /opt/backups/mongodb

- name: Remove old configs backup directory if it exists
  ansible.builtin.file:
    path: /opt/backups/configs
    state: absent

- name: Ensure required packages are installed
  ansible.builtin.apt:
    name:
      - rclone
      - tar
      - mongodb-org-tools
    state: present
    update_cache: yes

- name: Ensure rclone config directory exists
  ansible.builtin.file:
    path: /root/.config/rclone
    state: directory
    mode: '0700'
    owner: root
    group: root

- name: Deploy rclone.conf
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: /root/.config/rclone/rclone.conf
    mode: '0600'
    owner: root
    group: root

- name: Deploy backup script
  ansible.builtin.template:
    src: backup.sh.j2
    dest: /usr/local/bin/backup.sh
    mode: '0755'
    owner: root
    group: root

- name: Set up daily cron job for backup
  ansible.builtin.cron:
    name: "Daily Homelab Backup"
    minute: "0"
    hour: "3"
    job: "/usr/local/bin/backup.sh >> /var/log/backup.log 2>&1"
    user: root
    state: present
