---
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - curl
    state: present
    update_cache: true

- name: Install k3s server
  ansible.builtin.shell: |
    curl -sfL {{ k3s_install_url }} | sh -s - {{ k3s_install_extra_args }}
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  become: true

- name: Wait for k3s node to become ready
  ansible.builtin.command: /usr/local/bin/k3s kubectl get node
  register: k3s_nodes
  retries: "{{ k3s_ready_retries }}"
  delay: "{{ k3s_ready_delay }}"
  until: k3s_nodes.rc == 0
  become: true
