apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Loki
        uid: Loki
        type: loki
        access: proxy
        url: http://loki:3100

  grafana.ini: |
    [database]
    type = postgres
    host = 192.168.1.140
    name = grafana
    user = dbadmin
    password = $__env{GF_DATABASE_PASSWORD}
