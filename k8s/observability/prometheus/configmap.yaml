apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "uptime-kuma"
        metrics_path: /metrics

        static_configs:
          - targets:
              - "uptime-kuma:3001"

        basic_auth:
          username: ""
          password_file: /etc/prometheus/secrets/api-key
