apiVersion: v1
kind: Service
metadata:
  name: firefly3

spec:
  type: NodePort
  selector:
    app: firefly3

  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30000

---
apiVersion: v1
kind: Service
metadata:
  name: firefly3-importer
spec:
  type: NodePort
  selector:
    app: firefly3-importer
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30005
