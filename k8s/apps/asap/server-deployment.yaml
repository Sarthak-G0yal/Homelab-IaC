apiVersion: apps/v1
kind: Deployment
metadata:
  name: asap-server
  labels:
    app: asap-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asap-server
  template:
    metadata:
      labels:
        app: asap-server
    spec:
      containers:
        - name: asap-server
          image: sarthakg0yal/asap-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "250Mi"
              cpu: "500m"
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: asap-server-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: asap-server-secret
                  key: JWT_SECRET
            - name: TOKEN_EXP
              value: "7d"
            - name: FRONTEND_DOMAIN
              value: "https://asap.homelab118.home"
