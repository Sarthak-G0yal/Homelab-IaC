apiVersion: apps/v1
kind: Deployment
metadata:
  name: asap-client
  labels:
    app: asap-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asap-client
  template:
    metadata:
      labels:
        app: asap-client
    spec:
      containers:
        - name: asap-client
          image: sarthakg0yal/asap-client:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          env:
            - name: DOMAIN_NAME
              value: "homelab118.home"
            - name: VITE_BACKEND_SERVER_URL
              value: "http://192.168.1.170:30004"
